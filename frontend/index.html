<!DOCTYPE HTML>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plant Catalog</title>
    <link type="text/css" rel="stylesheet" href="./style/style.css">
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>Plant Catalog</h1>
        <a class="btn btn-dark" href="pages/add-plant.html">+ Add</a>
      </div>
    </header>

    <main>
      <p data-status-message aria-live="polite"></p>
      <div class="plant-list-header">
        <h2>Your plants</h2>
        <div class="status-filters" data-status-filters>
          <button type="button" class="status-filter active" data-filter="all">All · <span data-count>0</span></button>
          <button type="button" class="status-filter" data-filter="healthy">Healthy · <span data-count>0</span></button>
          <button type="button" class="status-filter" data-filter="sick">Sick · <span data-count>0</span></button>
          <button type="button" class="status-filter" data-filter="dead">Dead · <span data-count>0</span></button>
        </div>
      </div>
      <div class="plant-grid" data-plant-list></div>
    </main>

    <script type="module" src="./javascript/pages/plant-list/page.js"></script>
  </body>
</html>
